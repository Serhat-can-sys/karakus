<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karakuş Portal Girişi</title>

  <!-- Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen w-full bg-[#0f172a] text-slate-100 flex items-center justify-center p-4 relative overflow-hidden font-sans antialiased selection:bg-orange-500 selection:text-white">

  <!-- Background Grid Pattern -->
  <div class="fixed inset-0 bg-[linear-gradient(to_right,#1e293b15_1px,transparent_1px),linear-gradient(to_bottom,#1e293b15_1px,transparent_1px)] bg-[size:4rem_4rem] pointer-events-none"></div>

  <!-- Subtle Background Glow Elements -->
  <div class="absolute top-1/4 -left-32 w-80 h-80 bg-orange-600/15 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-1/4 -right-32 w-80 h-80 bg-amber-500/15 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Centered Professional Login Card -->
  <main class="max-w-md w-full bg-[#1e293b]/90 backdrop-blur-xl border border-slate-700/80 rounded-3xl shadow-2xl overflow-hidden z-10 p-6 sm:p-9 flex flex-col items-center relative">
    
    <!-- Large Prominent Logo at Top -->
    <div class="w-22 h-22 sm:w-24 sm:h-24 bg-white rounded-2xl p-2 shadow-xl border border-orange-200/50 flex items-center justify-center overflow-hidden mb-5 group transition-transform duration-300 hover:scale-105">
      <img src="logo.png" alt="Logo" class="w-full h-full object-contain" />
    </div>

    <!-- Title -->
    <div class="text-center mb-6">
      <h1 class="text-xl sm:text-2xl font-black text-white tracking-wide">
        Karakuş Portal Girişi
      </h1>
      <p class="text-xs text-slate-400 mt-1">
        Sisteme erişmek için aşağıdaki butona tıklayınız
      </p>
    </div>

    <!-- Action Area: Wide Prominent Clickable Button -->
    <div class="w-full space-y-4 my-2">
      <a 
        href="https://krkportal.ai.studio/" 
        target="_self"
        class="w-full py-4 px-6 bg-gradient-to-r from-orange-500 via-amber-500 to-orange-600 hover:from-orange-600 hover:to-amber-600 text-white font-black text-base rounded-2xl border-b-4 border-amber-800 active:border-b-0 active:translate-y-1 shadow-xl shadow-orange-950/50 hover:shadow-orange-500/30 transition-all duration-200 flex items-center justify-center gap-3 group cursor-pointer text-center"
      >
        <i data-lucide="log-in" class="w-5 h-5 text-white transition-transform group-hover:-translate-x-1"></i>
        <span>Sisteme Giriş İçin Tıklayınız</span>
        <i data-lucide="arrow-right" class="w-5 h-5 text-white transition-transform group-hover:translate-x-1.5"></i>
      </a>
    </div>

    <!-- Security & Protocol Badge Footer -->
    <div class="mt-6 pt-5 border-t border-slate-700/60 w-full flex items-center justify-center gap-2 text-[11px] text-slate-400 font-medium">
      <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i>
      <span>Güvenli Kurumsal Oturum Protokolü</span>
    </div>

  </main>

  <!-- Lucide Icons Initialization -->
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
