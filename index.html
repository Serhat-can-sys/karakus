<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karakuş Portal Girişi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-out { opacity: 0; transition: opacity 0.4s ease-in-out; }
    </style>
</head>
<body class="min-h-screen w-full bg-slate-900 text-slate-100 flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Arka Plan Işıkları (Görsel birebir aynı olsun diye) -->
    <div class="absolute top-1/4 -left-32 w-80 h-80 bg-orange-600/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 -right-32 w-80 h-80 bg-amber-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Ana Kart -->
    <div class="max-w-md w-full bg-slate-800/90 backdrop-blur-xl border border-slate-700/80 rounded-3xl shadow-2xl overflow-hidden z-10 p-6 sm:p-9 flex flex-col items-center">
        
        <!-- Logo -->
        <div class="w-[88px] h-[88px] sm:w-24 sm:h-24 bg-white rounded-2xl p-2 shadow-xl border border-orange-200/50 flex items-center justify-center overflow-hidden mb-5">
            <img src="logo.jpg" alt="Karakuş Logo" class="w-full h-full object-contain" onerror="this.style.display='none'">
        </div>

        <!-- Başlık -->
        <div class="text-center mb-6">
            <h1 class="text-xl sm:text-2xl font-black text-white tracking-wide">
                Karakuş Portal Girişi
            </h1>
            <p class="text-xs text-slate-400 mt-1">
                Sisteme erişmek için aşağıdaki butonu kullanınız
            </p>
        </div>

        <!-- GİRİŞ BUTONU (Form yerine) -->
        <div class="w-full mt-2">
            <button onclick="goToSystem()" class="w-full py-4 bg-orange-600 hover:bg-orange-500 text-white font-black text-sm rounded-xl border-b-4 border-orange-800 active:border-b-0 active:translate-y-1 shadow-[0_0_20px_rgba(249,115,22,0.3)] transition-all duration-150 flex items-center justify-center gap-2 group cursor-pointer">
                <span>Sisteme Giriş İçin Tıklayınız</span>
                <!-- Ok İkonu -->
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="group-hover:translate-x-1 transition-transform"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
            </button>
        </div>

        <!-- Alt Bilgi -->
        <div class="mt-8 text-center text-[10px] text-slate-500">
            &copy; 2026 Karakuş Lojistik. Tüm Hakları Saklıdır.
        </div>

    </div>

    <!-- Yumuşak Geçiş Scripti -->
    <script>
        function goToSystem() {
            // Ekranı yumuşakça karart (fade out)
            document.body.classList.add('fade-out');
            
            // 400 milisaniye sonra asıl sisteme yönlendir
            setTimeout(() => {
                window.location.href = "https://krkportal-xywy.onrender.com";
            }, 400);
        }
    </script>
</body>
</html>
