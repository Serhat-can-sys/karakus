<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karakuş Lojistik | Portal Girişi</title>
  
  <!-- Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              navy: '#0B132B',
              dark: '#1C2541',
              slate: '#3A506B',
              accent: '#F97316', // Kurumsal Turuncu
              accentHover: '#EA580C',
              gold: '#F59E0B'
            }
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #080D1A;
      background-image: 
        radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(58, 80, 107, 0.15) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.8) 0px, transparent 100%);
    }
    
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .orange-glow {
      box-shadow: 0 0 25px -5px rgba(249, 115, 22, 0.4);
    }
    
    .orange-glow:hover {
      box-shadow: 0 0 35px -2px rgba(249, 115, 22, 0.6);
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col items-center justify-between p-4 sm:p-6 font-sans antialiased selection:bg-orange-500 selection:text-white">

  <!-- Arka Plan Grid Desen Efekti -->
  <div class="fixed inset-0 bg-[linear-gradient(to_right,#1e293b15_1px,transparent_1px),linear-gradient(to_bottom,#1e293b15_1px,transparent_1px)] bg-[size:4rem_4rem] pointer-events-none"></div>

  <!-- Üst Header Bar -->
  <header class="w-full max-w-6xl mx-auto flex items-center justify-between py-4 z-10">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-orange-500 to-amber-600 flex items-center justify-center text-white shadow-lg shadow-orange-500/20">
        <i data-lucide="truck" class="w-5 h-5"></i>
      </div>
      <span class="font-bold text-lg tracking-tight text-white">
        KARAKUŞ <span class="text-orange-500 font-medium">LOJİSTİK</span>
      </span>
    </div>

    <div class="flex items-center space-x-2 text-xs text-slate-400 bg-slate-900/60 px-3 py-1.5 rounded-full border border-slate-800">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span>Sistem Çevrimiçi</span>
    </div>
  </header>

  <!-- Ana Karşılama Kartı (Ortalanmış Kutu) -->
  <main class="w-full max-w-md my-auto py-8 z-10">
    <div class="glass-card rounded-3xl p-8 sm:p-10 shadow-2xl relative overflow-hidden text-center transition-all duration-300">
      
      <!-- Dekoratif Üst Çizgi Aydınlatması -->
      <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-[2px] bg-gradient-to-r from-transparent via-orange-500 to-transparent"></div>

      <!-- Şirket Logosu / İkon Alanı -->
      <div class="relative mx-auto w-24 h-24 mb-6 flex items-center justify-center">
        <!-- Logo Arka Plan Halkası -->
        <div class="absolute inset-0 rounded-2xl bg-gradient-to-tr from-orange-500/20 to-slate-700/30 blur-xl"></div>
        
        <!-- Logo Çerçevesi -->
        <div class="relative w-full h-full rounded-2xl bg-slate-900/90 border border-slate-700/60 p-2 flex items-center justify-center shadow-inner group">
          <!-- İmaj Logosu Var İse (Otomatik yüklenir, yoksa şık SVG logo devreye girer) -->
          <img 
            src="logo.jpg" 
            alt="Karakuş Lojistik Logo" 
            class="max-h-full max-w-full object-contain rounded-xl"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
          />
          
          <!-- İmaj Yüklenemezse Çıkacak Yedek Logo Vektörü -->
          <div class="hidden w-full h-full rounded-xl bg-gradient-to-br from-slate-800 to-slate-900 flex-col items-center justify-center text-orange-500">
            <i data-lucide="shield-check" class="w-10 h-10 mb-1"></i>
            <span class="text-[9px] font-black tracking-widest text-slate-300 uppercase">Karakuş</span>
          </div>
        </div>
      </div>

      <!-- Başlık ve Açıklama -->
      <div class="space-y-2 mb-8">
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">
          Karakuş Lojistik
        </h1>
        <p class="text-xs sm:text-sm text-slate-400 font-medium">
          Kurumsal Taşımacılık & Operasyon Yönetim Portalı
        </p>
      </div>

      <!-- GİRİŞ BUTONU (YÖNLENDİRME LİNKİ) -->
      <!-- Yönlendirilecek URL adresini aşağıdaki 'href' alanından değiştirebilirsiniz -->
      <div class="space-y-4">
        <a 
          href="https://krkportal-xywy.onrender.com" 
          target="_blank"
          rel="noopener noreferrer"
          class="orange-glow group relative inline-flex items-center justify-center w-full px-6 py-4 text-base font-bold text-white transition-all duration-300 bg-gradient-to-r from-orange-500 via-amber-600 to-orange-600 rounded-2xl hover:from-orange-600 hover:to-amber-700 active:scale-[0.98] shadow-lg"
        >
          <span class="flex items-center space-x-2">
            <i data-lucide="log-in" class="w-5 h-5 transition-transform duration-300 group-hover:-translate-x-1"></i>
            <span>Sisteme Giriş Yap</span>
            <i data-lucide="arrow-right" class="w-5 h-5 transition-transform duration-300 group-hover:translate-x-1"></i>
          </span>
        </a>

        <p class="text-[11px] text-slate-500 font-normal">
          Güvenli oturum protokolü ile portal ekranına yönlendirilirsiniz.
        </p>
      </div>

      <!-- Küçük Modül Bilgilendirme Rozetleri -->
      <div class="mt-8 pt-6 border-t border-slate-800/80 grid grid-cols-3 gap-2 text-[10px] text-slate-400 font-medium">
        <div class="p-2 rounded-xl bg-slate-900/50 border border-slate-800/60 flex flex-col items-center">
          <i data-lucide="calculator" class="w-4 h-4 text-orange-400 mb-1"></i>
          <span>Navlun & BAF</span>
        </div>
        <div class="p-2 rounded-xl bg-slate-900/50 border border-slate-800/60 flex flex-col items-center">
          <i data-lucide="shield" class="w-4 h-4 text-sky-400 mb-1"></i>
          <span>Güvenlik & Vardiya</span>
        </div>
        <div class="p-2 rounded-xl bg-slate-900/50 border border-slate-800/60 flex flex-col items-center">
          <i data-lucide="fuel" class="w-4 h-4 text-emerald-400 mb-1"></i>
          <span>Akaryakıt & Filo</span>
        </div>
      </div>

    </div>
  </main>

  <!-- Alt Bilgi (Footer) -->
  <footer class="w-full max-w-6xl mx-auto py-4 text-center z-10">
    <p class="text-xs text-slate-500">
      &copy; <script>document.write(new Date().getFullYear())</script> Karakuş Lojistik. Tüm Hakları Saklıdır.
    </p>
  </footer>

  <!-- Lucide İkonlarını Başlatma Scripti -->
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
